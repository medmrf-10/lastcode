<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>البومرف</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
    background:#0a0a0a; color:#e7e9ea; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  nav { display:flex; gap:16px; width:min(680px,100%); }
  a.card {
    flex:1; display:flex; flex-direction:column; gap:10px; justify-content:center;
    min-height:180px; padding:28px; text-decoration:none;
    background:#191919; border:1px solid #2f3336; border-radius:16px;
    transition:border-color .15s;
  }
  a.card:hover { border-color:#1d9bf0; }
  .name {
    font-family:"JetBrains Mono",monospace; font-weight:700;
    font-size:clamp(28px,5vw,40px); color:#e7e9ea; direction:ltr; text-align:right;
  }
  .path {
    font-family:"JetBrains Mono",monospace; font-size:15px;
    color:#71767b; direction:ltr; text-align:right;
  }
  @media (max-width:560px) { nav { flex-direction:column; } a.card { min-height:120px; } }
</style>
</head>
<body>
  <nav>
    <a class="card" href="/twt/"><span class="name">twt</span><span class="path">/twt</span></a>
    <a class="card" href="/code/"><span class="name">code</span><span class="path">/code</span></a>
  </nav>
</body>
</html>
