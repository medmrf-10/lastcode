<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<title>/me</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
    background:#0a0a0a; color:#e7e9ea; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  main { width:min(720px,100%); text-align:center; }
  #clock {
    font-family:"JetBrains Mono",monospace; font-weight:700;
    font-size:clamp(48px,10vw,84px); letter-spacing:.04em; direction:ltr;
  }
  .stats { display:flex; gap:16px; margin-top:48px; }
  .stat {
    flex:1; background:#191919; border:1px solid #2f3336; border-radius:16px; padding:22px 12px;
  }
  .v { font-family:"JetBrains Mono",monospace; font-size:clamp(28px,5vw,42px); font-weight:700; color:#1d9bf0; }
  .l { color:#71767b; font-size:13px; margin-top:8px; }
  @media (max-width:560px) { .stats { flex-direction:column; } }
</style>
</head>
<body>
<main>
  <div id="clock">--:--:--</div>
  <div class="stats">
    <div class="stat"><div class="v" id="twt-due">—</div><div class="l">بطاقات twt مستحقة</div></div>
    <div class="stat"><div class="v" id="code-atoms">7</div><div class="l">ذرات code في قاعدة المعرفة</div></div>
    <div class="stat"><div class="v" id="vps-services">4</div><div class="l">خدمات VPS عاملة</div></div>
  </div>
</main>
<script>
  // ساعة حية
  const clock = document.getElementById('clock');
  const tick = () => { clock.textContent = new Date().toLocaleTimeString('en-GB'); };
  tick(); setInterval(tick, 1000);

  // بطاقات twt المستحقة — حي من API التطبيق نفسه
  fetch('/twt/api/status').then(r => r.json()).then(s => {
    document.getElementById('twt-due').textContent = (s.review_due ?? 0) + (s.learning_due ?? 0);
  }).catch(() => {});
</script>
<!--
  الرقمان الثابتان (يدويان حتى دمجهما بالمولّد):
  - ذرات code: من .learn/knowledge-base.json وقت كتابة الصفحة
  - خدمات VPS: عدد عمليات pm2 العاملة (twt, stm-web, learn99, picode)
-->
</body>
</html>
